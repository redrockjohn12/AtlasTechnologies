cat > crm/login.html <<'EOF'
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas Technologies CRM Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="crm-header">
    <h1>Atlas Technologies</h1>
    <p>Secure CRM Login</p>
</header>

<main class="crm-container">
    <section class="crm-card login-card">
        <h2>CRM Login</h2>
        <p>Sign in to access the Atlas Technologies business dashboard.</p>

        <form id="login-form">
            <input
                type="email"
                id="login-email"
                placeholder="Email address"
                autocomplete="email"
                required
            >

            <input
                type="password"
                id="login-password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Sign In</button>

            <p id="login-message" role="alert"></p>
        </form>
    </section>
</main>

<script src="supabase.js"></script>
<script src="login.js"></script>

</body>
</html>
EOF
