<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas Technologies CRM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="crm-header">
        <h1>Atlas Technologies CRM</h1>
        <p>Customer Management System</p>
    </header>

    <main class="crm-container">
    <section class="crm-card">
        <h2>Customers</h2>
        <div class="customer-count" id="customer-count">0</div>
        <p>Total customers</p>
    </section>

    <section class="crm-card">
        <h2>Add Customer</h2>
        <form id="customer-form">
            <input type="text" id="name" placeholder="Customer name" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="tel" id="phone" placeholder="Phone">
            <button type="submit">Add Customer</button>
        </form>
    </section>

    <section class="crm-card">
        <h2>Customer List</h2>
        <div id="customer-list">
            <p>No customers yet.</p>
        </div>
    </section>
    <script src="app.js"></script>
</body>
</html>
