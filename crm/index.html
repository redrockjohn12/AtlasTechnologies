<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atlas Technologies CRM</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="crm-header">
    <h1>Atlas Technologies</h1>
    <p>Business Management CRM</p>
</header>

<main class="crm-container">

    <!-- BUSINESS DASHBOARD -->
    <section class="crm-card dashboard-card">
        <h2>Business Dashboard</h2>

        <div class="dashboard-grid">

            <div class="dashboard-stat">
                <span>Customers</span>
                <strong id="dashboard-customers">0</strong>
            </div>

            <div class="dashboard-stat">
                <span>Leads</span>
                <strong id="dashboard-leads">0</strong>
            </div>

            <div class="dashboard-stat">
                <span>Projects</span>
                <strong id="dashboard-projects">0</strong>
            </div>

            <div class="dashboard-stat">
                <span>Quotes</span>
                <strong id="dashboard-quotes">0</strong>
            </div>

            <div class="dashboard-stat">
                <span>Invoices</span>
                <strong id="dashboard-invoices">0</strong>
            </div>

        </div>
    </section>


    <!-- CUSTOMERS -->
    <section class="crm-card">
        <h2>Customers</h2>

        <form id="customer-form">

            <input
                type="text"
                id="customer-name"
                placeholder="Customer name"
                required
            >

            <input
                type="email"
                id="customer-email"
                placeholder="Customer email"
                required
            >

            <input
                type="tel"
                id="customer-phone"
                placeholder="Phone number"
            >

            <button type="submit">Add Customer</button>

        </form>

        <div id="customer-list"></div>
    </section>


    <!-- LEADS & ENQUIRIES -->
    <section class="crm-card">
        <h2>Leads & Enquiries</h2>

        <form id="lead-form">

            <input
                type="text"
                id="lead-name"
                placeholder="Lead name"
                required
            >

            <input
                type="email"
                id="lead-email"
                placeholder="Lead email"
                required
            >

            <input
                type="tel"
                id="lead-phone"
                placeholder="Phone number"
            >

            <select id="lead-service" required>
                <option value="">Select service</option>
                <option value="Software Development">
                    Software Development
                </option>
                <option value="Mobile Applications">
                    Mobile Applications
                </option>
                <option value="AI & Automation">
                    AI & Automation
                </option>
                <option value="Web Development">
                    Web Development
                </option>
                <option value="Digital Systems">
                    Digital Systems
                </option>
                <option value="Other">
                    Other
                </option>
            </select>

            <button type="submit">Add Lead</button>

        </form>

        <div id="lead-list"></div>
    </section>


    <!-- PROJECTS -->
    <section class="crm-card">
        <h2>Projects</h2>

        <form id="project-form">

            <input
                type="text"
                id="project-name"
                placeholder="Project name"
                required
            >

            <input
                type="text"
                id="project-client"
                placeholder="Client"
                required
            >

            <input
                type="text"
                id="project-service"
                placeholder="Service"
                required
            >

            <select id="project-status" required>
                <option value="">Select status</option>
                <option value="Planning">Planning</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
                <option value="On Hold">On Hold</option>
            </select>

            <button type="submit">Add Project</button>

        </form>

        <div id="project-list"></div>
    </section>


    <!-- QUOTES -->
    <section class="crm-card">
        <h2>Quotes</h2>

        <form id="quote-form">

            <input
                type="text"
                id="quote-client"
                placeholder="Client"
                required
            >

            <input
                type="text"
                id="quote-service"
                placeholder="Service"
                required
            >

            <input
                type="number"
                id="quote-amount"
                placeholder="Amount"
                step="0.01"
                min="0"
                required
            >

            <select id="quote-status" required>
                <option value="">Select status</option>
                <option value="Draft">Draft</option>
                <option value="Sent">Sent</option>
                <option value="Accepted">Accepted</option>
                <option value="Rejected">Rejected</option>
            </select>

            <button type="submit">Add Quote</button>

        </form>

        <div id="quote-list"></div>
    </section>


    <!-- INVOICES -->
    <section class="crm-card">
        <h2>Invoices</h2>

        <form id="invoice-form">

            <input
                type="text"
                id="invoice-number"
                placeholder="Invoice number"
                required
            >

            <input
                type="text"
                id="invoice-client"
                placeholder="Client"
                required
            >

            <input
                type="text"
                id="invoice-service"
                placeholder="Service"
                required
            >

            <input
                type="number"
                id="invoice-amount"
                placeholder="Amount"
                step="0.01"
                min="0"
                required
            >

            <select id="invoice-status" required>
                <option value="">Select status</option>
                <option value="Draft">Draft</option>
                <option value="Sent">Sent</option>
                <option value="Paid">Paid</option>
                <option value="Overdue">Overdue</option>
            </select>

            <button type="submit">Add Invoice</button>

        </form>

        <div id="invoice-list"></div>
    </section>


    <!-- CUSTOMER NOTES & COMMUNICATION -->
    <section class="crm-card">
        <h2>Customer Notes & Communication</h2>

        <form id="note-form">

            <input
                type="text"
                id="note-customer"
                placeholder="Customer"
                required
            >

            <textarea
                id="note-text"
                placeholder="Enter customer note or communication..."
                required
            ></textarea>

            <button type="submit">Add Note</button>

        </form>

        <div id="note-list"></div>
    </section>

</main>


<!-- Supabase library -->
<script src="supabase.js"></script>

<!-- Authentication protection -->
<script src="auth-guard.js"></script>

</body>
</html>
